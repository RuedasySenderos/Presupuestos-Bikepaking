<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ruta · Ruedas y Senderos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--pino:#24452F;--musgo:#5E8C35;--lago:#2C6E8F;--texto:#2F2B27;--gris:#6F6A63;--fondo:#F4F6F1;--panel:#fff;--linea:#DCE2D6;--suave:#EAF0E4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo:#141A16;--panel:#1C241E;--texto:#E8ECE4;--linea:#33402F;--suave:#223026;--gris:#A3AB9E}}
:root[data-theme="dark"]{--fondo:#141A16;--panel:#1C241E;--texto:#E8ECE4;--linea:#33402F;--suave:#223026;--gris:#A3AB9E}
*{box-sizing:border-box} html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.45 "Barlow",Arial,Helvetica,sans-serif}
header img{display:block;width:100%;max-height:220px;object-fit:cover}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 clamp(26px,5vw,36px)/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:0 0 4px}
.sub{color:var(--gris);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.stats div{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font:700 22px "Barlow Condensed",Arial,sans-serif;color:var(--musgo)}
.stats small{color:var(--gris);font-size:13px}
#mapa{height:min(60vh,460px);border-radius:14px;border:1px solid var(--linea);z-index:0}
.perfil{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:10px 12px;margin-top:12px}
.perfil h2,.abrir h2{font:600 18px "Barlow Condensed",Arial,sans-serif;margin:0 0 6px}
.perfil svg{width:100%;height:auto;display:block}
.abrir{background:var(--pino);color:#fff;border-radius:16px;padding:18px;margin-top:14px}
.abrir p{margin:6px 0 0;color:#DCE8D3;font-size:14px}
.abrir .mini{font-size:13px;margin-top:12px}.abrir a{color:#B9DD8E}
.ter{background:transparent;color:#DCE8D3;text-decoration:underline;padding:13px 6px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
button,.btn{font:600 16px "Barlow",Arial,sans-serif;border-radius:12px;border:none;padding:13px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.prim{background:#fff;color:var(--pino)} .sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
:focus-visible{outline:3px solid #B9DD8E;outline-offset:2px}
.aviso{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:24px;text-align:center;color:var(--gris)}
footer{text-align:center;color:var(--gris);font-size:12px;margin-top:20px}
</style>
</head>

<script>
(() => {
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>{ const [i,f]=Math.abs(n).toFixed(d).split('.'); return (n<0?'-':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(f?','+f:''); };
function dec(str){ const out=[]; let i=0; while(i<str.length){ let b,sh=0,r=0; do{ b=str.charCodeAt(i++)-63; r|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20); out.push(r&1?~(r>>1):(r>>1)); } return out; }
const q=new URLSearchParams(location.hash.slice(1));
let meta={}; try{ meta=JSON.parse(q.get('m')||'{}'); }catch(e){}
const ll=dec(q.get('p')||''), ee=dec(q.get('e')||'');
const pts=[]; let la=0,lo=0,el=0;
for(let k=0;k+1<ll.length;k+=2){ la+=ll[k]; lo+=ll[k+1]; el+=(ee[k/2]||0); pts.push([la/1e5,lo/1e5,el]); }
if(pts.length<2){ $('main').innerHTML='<div class="aviso">Este enlace no contiene ninguna ruta. Pide a Ruedas y Senderos que te lo envíen de nuevo.</div>'; return; }

// distancia acumulada
const R=6371000, rad=x=>x*Math.PI/180; const dist=[0];
for(let k=1;k<pts.length;k++){ const [a1,o1]=pts[k-1],[a2,o2]=pts[k]; const dA=rad(a2-a1), dO=rad(o2-o1);
  const h=Math.sin(dA/2)**2+Math.cos(rad(a1))*Math.cos(rad(a2))*Math.sin(dO/2)**2; dist.push(dist[k-1]+2*R*Math.asin(Math.sqrt(h))); }
const km = meta.k || dist[dist.length-1]/1000;
if(meta.k && dist[dist.length-1]>0){ const f=meta.k*1000/dist[dist.length-1]; for(let k=0;k<dist.length;k++) dist[k]*=f; }
const eles=pts.map(p=>p[2]); const amax=Math.max(...eles), amin=Math.min(...eles);
let dpos=meta.d; if(dpos==null){ dpos=0; for(let k=1;k<eles.length;k++) if(eles[k]>eles[k-1]) dpos+=eles[k]-eles[k-1]; }

document.title=(meta.n||'Ruta')+' · Ruedas y Senderos';
$('titulo').textContent=meta.n||'Tu ruta';
$('sub').textContent=[meta.a,meta.b].filter(Boolean).join('  →  ')+(meta.ref?'  ·  '+meta.ref:'');
const st=[[fmt(km,1)+' km','Distancia'],[fmt(dpos)+' m','Desnivel +'],[fmt(amax)+' m','Altitud máx.'],[fmt(amin)+' m','Altitud mín.']];
if(meta.t!=null) st.push([meta.t+' %','Sin asfaltar']);
$('stats').innerHTML=st.map(([v,l])=>`<div><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join('');

// mapa
if(window.L){
  const map=L.map('mapa',{scrollWheelZoom:false});
  const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap, SRTM · © OpenTopoMap (CC-BY-SA)'});
  const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© colaboradores de OpenStreetMap'});
  topo.addTo(map); L.control.layers({'Topográfico':topo,'Callejero':osm}).addTo(map);
  const lat=pts.map(p=>[p[0],p[1]]);
  L.polyline(lat,{color:'#ffffff',weight:8,opacity:.9}).addTo(map);
  const linea=L.polyline(lat,{color:'#D9480F',weight:4.5}).addTo(map);
  L.circleMarker(lat[0],{radius:8,color:'#fff',weight:3,fillColor:'#2E6B3F',fillOpacity:1}).addTo(map).bindTooltip('Inicio');
  L.circleMarker(lat[lat.length-1],{radius:8,color:'#fff',weight:3,fillColor:'#B3261E',fillOpacity:1}).addTo(map).bindTooltip('Fin');
  map.fitBounds(linea.getBounds(),{padding:[20,20]});
} else { $('mapa').innerHTML='<div class="aviso">No se pudo cargar el mapa.</div>'; }

// perfil de altitud
(() => {
  const W=900,H=200,P={l:46,r:10,t:10,b:26}; const tot=dist[dist.length-1]||1;
  const pasoY=[50,100,200,250,500,1000].find(s=>(amax-amin)/s<=4)||1000;
  const y0=Math.floor(amin/pasoY)*pasoY, y1=Math.max(Math.ceil(amax/pasoY)*pasoY, y0+pasoY), nY=Math.round((y1-y0)/pasoY);
  const X=d=>P.l+(W-P.l-P.r)*d/tot, Y=e=>P.t+(H-P.t-P.b)*(1-(e-y0)/((y1-y0)||1));
  let d='M'+X(0)+','+Y(eles[0]); for(let k=1;k<pts.length;k++) d+=' L'+X(dist[k]).toFixed(1)+','+Y(eles[k]).toFixed(1);
  const area=d+` L${X(tot)},${H-P.b} L${X(0)},${H-P.b} Z`;
  let ejes=''; for(let k=0;k<=nY;k++){ const v=y0+pasoY*k, yy=Y(v); ejes+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="currentColor" opacity=".12"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end" font-size="12" fill="currentColor" opacity=".6">${Math.round(v)}</text>`; }
  const totKm=tot/1000, paso=[1,2,5,10,20,25,50,100,200].find(s=>totKm/s<=6)||500; let xs='';
  for(let k=0;k<=totKm+1e-9;k+=paso){ xs+=`<text x="${X(k*1000)}" y="${H-6}" text-anchor="middle" font-size="12" fill="currentColor" opacity=".6">${k} km</text>`; }
  $('perfil').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil de altitud: de ${Math.round(amin)} a ${Math.round(amax)} metros">${ejes}<path d="${area}" fill="#5E8C35" opacity=".25"/><path d="${d}" fill="none" stroke="#24452F" stroke-width="2"/>${xs}</svg>`;
})();

// GPX para Organic Maps
const nombre=(meta.n||'Ruta Ruedas y Senderos');
function gpx(){
  const e=s=>String(s).replace(/[<&>]/g,c=>({'<':'&lt;','&':'&amp;','>':'&gt;'}[c]));
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Ruedas y Senderos" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${e(nombre)}</name></metadata>\n`+
    `<wpt lat="${pts[0][0]}" lon="${pts[0][1]}"><name>Inicio: ${e(meta.a||'')}</name></wpt>\n<wpt lat="${pts[pts.length-1][0]}" lon="${pts[pts.length-1][1]}"><name>Fin: ${e(meta.b||'')}</name></wpt>\n`+
    `<trk><name>${e(nombre)}</name><trkseg>\n`+pts.map(p=>`<trkpt lat="${p[0].toFixed(5)}" lon="${p[1].toFixed(5)}"><ele>${Math.round(p[2])}</ele></trkpt>`).join('\n')+`\n</trkseg></trk>\n</gpx>`;
}
const archivo=nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,'')+'.gpx';
const ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua), android=/Android/.test(ua), movil=ios||android;
const APPS={
  wikiloc:{nombre:'Wikiloc', ayuda: ios?'Pulsa el botón y elige Wikiloc en el menú Compartir: la ruta se importa para seguirla.':android?'Pulsa el botón y elige Wikiloc: la ruta se importa para seguirla con el navegador de la app.':'Se descargará el archivo GPX. Súbelo en wikiloc.com (Subir ruta) o pásalo al móvil y ábrelo con Wikiloc.'},
  organic:{nombre:'Organic Maps', ayuda: ios?'Pulsa el botón y elige Organic Maps en el menú Compartir: el trazado queda guardado, también sin conexión.':android?'Pulsa el botón y elige Organic Maps: el trazado queda guardado, también sin conexión.':'Se descargará el archivo GPX. Pásalo al móvil y ábrelo con Organic Maps.'}
};
// Por caminos, senderos y montaña: Wikiloc (seguimiento de track y comunidad). Por carretera: Organic Maps.
const orden = meta.y==='carretera' ? ['organic','wikiloc'] : ['wikiloc','organic'];
$('recom').textContent = meta.y==='carretera'
  ? 'Para una ruta por carretera te recomendamos Organic Maps: navegación clara y mapas sin conexión. También puedes usar Wikiloc.'
  : 'Para una ruta por caminos y senderos te recomendamos Wikiloc: sigue el track con avisos si te sales. También puedes usar Organic Maps sin conexión.';
$('btns').innerHTML = orden.map((k,i)=>`<button class="${i?'sec':'prim'}" data-app="${k}">Abrir en ${APPS[k].nombre}</button>`).join('') + (movil?'<button class="ter" data-app="gpx">Descargar GPX</button>':'');
$('ayuda').textContent = APPS[orden[0]].ayuda;
async function entregar(app){
  const blob=new Blob([gpx()],{type:'application/gpx+xml'});
  const file=new File([blob],archivo,{type:'application/gpx+xml'});
  if(app!=='gpx' && navigator.canShare && navigator.canShare({files:[file]})){
    $('ayuda').textContent=APPS[app].ayuda;
    try{ await navigator.share({files:[file],title:nombre}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=archivo; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
  $('ayuda').textContent = app==='gpx' ? 'GPX descargado. Ábrelo desde Descargas con la app que prefieras.' : 'Track descargado. '+APPS[app].ayuda.replace(/^Pulsa el botón y e/,'E').replace(/^Se descargará el archivo GPX\. /,'');
}
$('btns').addEventListener('click',e=>{ const b=e.target.closest('[data-app]'); if(b) entregar(b.dataset.app); });
})();
</script>
